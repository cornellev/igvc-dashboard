[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomy-dashboard-backend"
version = "0.1.0"
description = "Autonomy dashboard backend with the existing ROS implementation retained as filler"
requires-python = ">=3.10"
dynamic = ["dependencies"]

# Keep one dependency list while the existing Docker/pip workflow is retained.
# ROS packages such as rclpy still come from the ROS environment, not PyPI.
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["main", "zenoh_client", "state", "models", "controls"]

[tool.setuptools.packages.find]
where = ["."]
include = ["subscribers*"]
